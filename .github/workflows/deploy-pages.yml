# Builds the app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings -> Pages -> Source -> GitHub Actions.
# No secrets are needed. The deployed demo holds no API keys; visitors who want
# live Marble generation paste in their own (see the Settings screen).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Pages serves from https://<user>.github.io/<repo>/, so the app must be
      # built with that subpath baked in. Deriving it from the repository name
      # means this works in a fork or after a rename with no edits.
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages 404s on paths starting with an underscore unless this file exists.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
